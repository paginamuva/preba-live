name: Transmision YouTube Hoy (5 Horas)

on:
  workflow_dispatch: # Ejecución manual únicamente (no se repetirá otros días)

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 315 # 5 horas y 15 min de margen para cierre limpio

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Configurar entorno Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Iniciar transmisión en vivo
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: python stream.py
